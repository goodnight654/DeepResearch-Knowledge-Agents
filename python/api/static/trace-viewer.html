<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace Viewer | DeepResearch Knowledge Hub</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");

      :root {
        --bg: #f8f6f1;
        --panel: #ffffff;
        --ink: #1f2430;
        --sub: #5a6170;
        --accent: #154d71;
        --accent-soft: #d5ecfa;
        --plan: #0a5a82;
        --retrieve: #2d7f5e;
        --summarize: #8e5f14;
        --gap: #7f2d2d;
        --synthesize: #4c2d8c;
        --shadow: 0 10px 26px rgba(20, 36, 52, 0.12);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 15% -10%, #fff4d6 0%, transparent 45%),
          radial-gradient(circle at 100% 20%, #d8ecff 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        font-family: "Space Grotesk", "PingFang SC", "Noto Sans SC", sans-serif;
      }

      header {
        padding: 28px 32px 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: 0.3px;
      }

      .subtitle {
        margin-top: 8px;
        color: var(--sub);
        font-size: 15px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 18px;
        padding: 0 22px 24px;
      }

      .panel {
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .runs-panel {
        padding: 14px;
        min-height: 70vh;
      }

      .viewer-panel {
        padding: 14px;
        min-height: 70vh;
      }

      .panel-title {
        margin: 6px 8px 12px;
        font-size: 14px;
        font-weight: 700;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        margin: 0 8px 12px;
      }

      .toolbar input,
      .toolbar select,
      .toolbar button {
        border: 1px solid #d7dbe3;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
      }

      .toolbar input {
        flex: 1;
      }

      .toolbar button {
        background: var(--accent);
        color: #fff;
        border: none;
        cursor: pointer;
      }

      .run-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 72vh;
        overflow: auto;
        padding: 0 4px 2px;
      }

      .run-card {
        border: 1px solid #e9ecf2;
        border-radius: 12px;
        padding: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .run-card:hover {
        border-color: #bdccda;
        transform: translateY(-1px);
      }

      .run-card.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .run-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .badge {
        border-radius: 999px;
        background: #eef2f8;
        color: #374357;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 700;
      }

      .run-id {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: #657086;
        margin-top: 4px;
      }

      .run-q {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.35;
      }

      .empty {
        color: #7a8496;
        font-size: 13px;
        margin: 16px 10px;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .meta-item {
        border: 1px solid #e5e9f1;
        border-radius: 10px;
        padding: 8px 10px;
      }

      .meta-k {
        font-size: 11px;
        color: #748097;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .meta-v {
        margin-top: 4px;
        font-size: 13px;
        word-break: break-word;
      }

      .question-box {
        border-left: 4px solid var(--accent);
        background: #f6f9fc;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 14px;
      }

      .timeline {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .event {
        border: 1px solid #e7ebf3;
        border-left-width: 5px;
        border-radius: 12px;
        padding: 10px 12px;
        background: #fff;
      }

      .event.plan { border-left-color: var(--plan); }
      .event.retrieve_round { border-left-color: var(--retrieve); }
      .event.summarize_round { border-left-color: var(--summarize); }
      .event.assess_gap { border-left-color: var(--gap); }
      .event.synthesize { border-left-color: var(--synthesize); }
      .event.qa_answer { border-left-color: var(--accent); }

      .event-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .event-name {
        font-weight: 700;
        font-size: 13px;
      }

      .event-time {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: #7a8394;
      }

      .event-pre {
        margin-top: 8px;
        white-space: pre-wrap;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
        color: #273040;
      }

      .summary {
        margin-top: 14px;
        border-top: 1px dashed #d8deea;
        padding-top: 12px;
      }

      .summary h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .summary p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
      }

      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DeepResearch / QA Trace Viewer</h1>
      <div class="subtitle">按轮次查看 <span class="mono">plan → retrieve → summarize → gap → synthesize</span> 的执行轨迹。</div>
    </header>

    <main class="layout">
      <section class="panel runs-panel">
        <div class="panel-title">Runs</div>
        <div class="toolbar">
          <select id="workflowFilter">
            <option value="">all workflows</option>
            <option value="qa">qa</option>
            <option value="deepresearch">deepresearch</option>
            <option value="deepsearch">deepsearch</option>
          </select>
          <input id="runSearch" placeholder="filter by run_id / question" />
          <button id="refreshBtn" type="button">refresh</button>
        </div>
        <div id="runList" class="run-list"></div>
      </section>

      <section class="panel viewer-panel">
        <div class="panel-title">Trace Detail</div>
        <div id="traceRoot" class="empty">请选择左侧一个 run 查看详情。</div>
      </section>
    </main>

    <script>
      const state = {
        allRuns: [],
        filteredRuns: [],
        activeRunId: null,
      };

      const runListEl = document.getElementById("runList");
      const traceRootEl = document.getElementById("traceRoot");
      const workflowFilterEl = document.getElementById("workflowFilter");
      const runSearchEl = document.getElementById("runSearch");
      const refreshBtnEl = document.getElementById("refreshBtn");

      function fmt(v) {
        if (v === null || v === undefined) return "-";
        return String(v);
      }

      function shortText(text, maxLen = 120) {
        if (!text) return "";
        return text.length > maxLen ? `${text.slice(0, maxLen)}...` : text;
      }

      function eventClass(name) {
        return (name || "").replace(/[^a-zA-Z0-9_]/g, "");
      }

      function prettyJson(obj) {
        try {
          return JSON.stringify(obj, null, 2);
        } catch {
          return String(obj);
        }
      }

      function renderRuns() {
        runListEl.innerHTML = "";
        if (!state.filteredRuns.length) {
          runListEl.innerHTML = '<div class="empty">没有匹配的 runs。</div>';
          return;
        }

        for (const run of state.filteredRuns) {
          const card = document.createElement("div");
          card.className = `run-card${run.run_id === state.activeRunId ? " active" : ""}`;
          card.innerHTML = `
            <div class="run-row">
              <span class="badge">${fmt(run.workflow)}</span>
              <span class="badge">${fmt(run.status)}</span>
            </div>
            <div class="run-id">${fmt(run.run_id)}</div>
            <div class="run-q">${shortText(run.question || "(no question)")}</div>
          `;
          card.addEventListener("click", () => {
            openRun(run.run_id, true);
          });
          runListEl.appendChild(card);
        }
      }

      function applyFilter() {
        const wf = workflowFilterEl.value.trim();
        const q = runSearchEl.value.trim().toLowerCase();
        state.filteredRuns = state.allRuns.filter((run) => {
          if (wf && run.workflow !== wf) return false;
          if (!q) return true;
          return (`${run.run_id} ${run.question || ""}`).toLowerCase().includes(q);
        });
        renderRuns();
      }

      async function fetchRuns() {
        const wf = workflowFilterEl.value.trim();
        const params = new URLSearchParams({ limit: "80" });
        if (wf) params.set("workflow", wf);

        const resp = await fetch(`/api/qa/runs?${params.toString()}`);
        if (!resp.ok) {
          throw new Error(`runs fetch failed: ${resp.status}`);
        }
        state.allRuns = await resp.json();
        applyFilter();
      }

      function renderTrace(record) {
        const trace = Array.isArray(record.trace) ? record.trace : [];
        const output = record.output || {};
        traceRootEl.innerHTML = "";

        const meta = document.createElement("div");
        meta.className = "meta-grid";
        meta.innerHTML = `
          <div class="meta-item"><div class="meta-k">Run ID</div><div class="meta-v mono">${fmt(record.run_id)}</div></div>
          <div class="meta-item"><div class="meta-k">Workflow</div><div class="meta-v">${fmt(record.workflow)}</div></div>
          <div class="meta-item"><div class="meta-k">Status</div><div class="meta-v">${fmt(record.status)}</div></div>
          <div class="meta-item"><div class="meta-k">Created</div><div class="meta-v">${fmt(record.created_at)}</div></div>
        `;
        traceRootEl.appendChild(meta);

        const question = document.createElement("div");
        question.className = "question-box";
        question.textContent = fmt((record.input || {}).question || "(no question)");
        traceRootEl.appendChild(question);

        const timeline = document.createElement("div");
        timeline.className = "timeline";

        if (!trace.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "该 run 没有 trace 事件。";
          timeline.appendChild(empty);
        } else {
          for (const evt of trace) {
            const ev = document.createElement("div");
            const name = evt.event || "unknown";
            ev.className = `event ${eventClass(name)}`;
            ev.innerHTML = `
              <div class="event-head">
                <div class="event-name">${fmt(name)}</div>
                <div class="event-time">${fmt(evt.ts)}</div>
              </div>
              <pre class="event-pre">${prettyJson(evt.payload || {})}</pre>
            `;
            timeline.appendChild(ev);
          }
        }
        traceRootEl.appendChild(timeline);

        const summary = document.createElement("section");
        summary.className = "summary";
        summary.innerHTML = `
          <h3>Output Summary</h3>
          <p><strong>confidence:</strong> ${fmt(output.confidence)} | <strong>iterations:</strong> ${fmt(output.iterations)}</p>
          <p style="margin-top:8px;"><strong>executive_summary:</strong> ${fmt(output.executive_summary || "-")}</p>
          <p style="margin-top:8px;"><strong>answer:</strong> ${fmt(output.answer || "-")}</p>
        `;
        traceRootEl.appendChild(summary);
      }

      async function openRun(runId, pushHistory = false) {
        if (!runId) return;
        state.activeRunId = runId;
        renderRuns();

        if (pushHistory) {
          const url = new URL(window.location.href);
          url.searchParams.set("run_id", runId);
          window.history.replaceState({}, "", url);
        }

        traceRootEl.innerHTML = '<div class="empty">加载中...</div>';
        try {
          const resp = await fetch(`/api/qa/runs/${encodeURIComponent(runId)}`);
          if (!resp.ok) {
            throw new Error(`trace fetch failed: ${resp.status}`);
          }
          const record = await resp.json();
          renderTrace(record);
        } catch (err) {
          traceRootEl.innerHTML = `<div class="empty">读取 run 失败: ${err.message}</div>`;
        }
      }

      async function bootstrap() {
        try {
          await fetchRuns();
        } catch (err) {
          runListEl.innerHTML = `<div class="empty">加载 runs 失败: ${err.message}</div>`;
          return;
        }

        const url = new URL(window.location.href);
        const runIdFromQuery = url.searchParams.get("run_id");
        if (runIdFromQuery) {
          await openRun(runIdFromQuery);
          return;
        }

        if (state.filteredRuns.length) {
          await openRun(state.filteredRuns[0].run_id);
        }
      }

      workflowFilterEl.addEventListener("change", async () => {
        await fetchRuns();
      });
      runSearchEl.addEventListener("input", applyFilter);
      refreshBtnEl.addEventListener("click", fetchRuns);

      bootstrap();
    </script>
  </body>
</html>
